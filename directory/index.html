<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Business Directory — Devbhoomi Charitable Trust NZ</title>
<meta name="description" content="Discover trusted businesses and services across Aotearoa New Zealand, supported by the Devbhoomi Charitable Trust NZ community directory.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F2D3D; --navy-soft:#2A3B4D;
    --ochre:#C0832C; --ochre-deep:#A66E22;
    --cream:#FBF7EF; --cream-deep:#F2EEE4;
    --card:#FFFFFF; --line:#E6DDCB; --line-soft:#EFE7D7;
    --text:#2B2B2B; --muted:#6B6B6B;
    --radius:12px; --maxw:1080px;
    --shadow:0 8px 30px rgba(31,45,61,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--cream-deep);color:var(--text);
    font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

  /* Hero */
  .hero{background:var(--navy);color:#fff;padding:34px 0 30px}
  .hero .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ochre);font-weight:600}
  .hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:46px;line-height:1.05;margin:8px 0 6px}
  .hero h1 em{font-style:italic;color:var(--ochre)}
  .hero .sub{color:#C5CDD6;font-size:16px;margin:0 0 22px}
  .searchbar{display:flex;gap:12px;max-width:840px}
  .searchbar input{flex:1;min-width:0;font-family:inherit;font-size:17px;color:var(--text);
    background:#fff;border:none;border-radius:10px;padding:15px 18px}
  .searchbar input:focus{outline:3px solid rgba(192,131,44,.5)}
  .searchbar button{font-family:inherit;font-size:16px;font-weight:600;color:#fff;
    background:transparent;border:1.5px solid rgba(255,255,255,.35);border-radius:10px;
    padding:0 26px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
  .searchbar button:hover{background:rgba(255,255,255,.10);border-color:#fff}

  /* Sections */
  main{padding:34px 0 10px;min-height:40vh}
  .seclabel{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ochre-deep);font-weight:600;margin:0 0 16px}
  .seclabel.dark{color:var(--muted)}
  .sec{margin-bottom:40px}

  /* Featured */
  .feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .feat-card{display:flex;gap:16px;align-items:flex-start;background:var(--card);
    border:1.5px solid var(--ochre);border-radius:var(--radius);padding:18px 20px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease}
  .feat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .avatar{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;
    font-weight:700;font-size:17px;letter-spacing:.02em}
  .feat-card .fc-name{font-size:17px;font-weight:600;color:var(--navy);line-height:1.2}
  .feat-card .fc-cat{color:var(--ochre-deep);font-size:14px;font-weight:500;margin:2px 0 8px}
  .feat-card .fc-loc{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:5px}

  /* Category grid */
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .cat-tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .cat-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-soft)}
  .cat-ico{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;margin-bottom:16px}
  .cat-ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cat-name{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;color:var(--navy);line-height:1.1}
  .cat-count{color:var(--muted);font-size:13.5px;margin-top:4px}

  /* CTA */
  .cta{background:var(--navy);border-radius:16px;padding:30px 34px;display:flex;
    align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:40px}
  .cta h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:#fff;font-size:28px;margin:0 0 6px}
  .cta .cta-sub{color:#C5CDD6;font-size:14.5px;margin:0}
  .cta .cta-note{color:#9AA6B2;font-size:13px;font-style:italic;margin:6px 0 0}
  .cta a{background:var(--ochre);color:#fff;text-decoration:none;font-weight:700;font-size:15.5px;
    padding:14px 28px;border-radius:99px;white-space:nowrap;transition:background .15s ease}
  .cta a:hover{background:var(--ochre-deep)}

  /* Listing cards (shared: category & search views) */
  .breadcrumb{font-size:13.5px;color:var(--muted);margin-bottom:14px}
  .breadcrumb a{color:var(--ochre-deep);text-decoration:none;cursor:pointer}
  .breadcrumb a:hover{text-decoration:underline}
  .view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .view-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:32px;margin:0}
  .view-head .count{color:var(--muted);font-size:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
  .lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .lcard.feat{border-color:var(--ochre)}
  .lcard-top{display:flex;gap:14px;align-items:flex-start}
  .lcard .lc-name{font-size:17px;font-weight:600;color:var(--navy);line-height:1.2}
  .badge{display:inline-block;background:rgba(192,131,44,.14);color:var(--ochre-deep);
    font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .lc-meta{color:var(--muted);font-size:13.5px;margin:3px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lc-cat{color:var(--ochre-deep);font-weight:500}
  .lc-desc{font-size:14px;color:var(--text);margin:14px 0 0;line-height:1.5}
  .lc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .lc-tag{background:var(--cream);border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--navy);padding:3px 10px}
  .lc-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .lbtn{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 15px;
    cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;transition:all .15s ease}
  .lbtn:hover{border-color:var(--navy)}
  .lbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .lbtn.primary:hover{background:var(--navy-soft)}
  .lc-actions{margin-top:auto;padding-top:18px}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty h2{font-family:"Cormorant Garamond",Georgia,serif;color:var(--navy);font-size:26px;font-weight:600;margin:0 0 8px}

  /* Sort + pagination (category/search) */
  .sortbar{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
  .sortbar .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
  .sortbar .seg button{font-family:inherit;font-size:13px;font-weight:600;color:var(--navy);
    background:#fff;border:none;padding:8px 14px;cursor:pointer;transition:all .15s ease}
  .sortbar .seg button+button{border-left:1.5px solid var(--line)}
  .sortbar .seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .pager{display:flex;justify-content:center;align-items:center;gap:7px;margin:30px 0 6px;flex-wrap:wrap}
  .pager button{font-family:inherit;font-size:14px;font-weight:600;min-width:38px;height:38px;
    padding:0 10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;cursor:pointer;transition:all .15s ease}
  .pager button:hover:not(:disabled){border-color:var(--navy)}
  .pager button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager .ell{color:var(--muted);padding:0 2px}

  /* Detail */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:760px}
  .detail-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:8px}
  .detail h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:30px;margin:0;line-height:1.1}
  .detail .d-cat{color:var(--ochre-deep);font-weight:500;font-size:15px;margin-top:2px}
  .detail h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
  .detail p{margin:0 0 6px;font-size:15px}
  .d-contact{display:flex;flex-direction:column;gap:8px}
  .d-contact .row{display:flex;gap:10px;font-size:15px}
  .d-contact .row .lab{color:var(--muted);width:90px;flex:none}
  .d-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}

  footer{background:var(--navy);color:#9AA6B2;font-size:13px;text-align:center;padding:24px 0;margin-top:30px}
  footer a{color:var(--ochre)}

  @media (max-width:880px){ .cat-grid{grid-template-columns:repeat(2,1fr)} .hero h1{font-size:38px} }
  @media (max-width:560px){
    .cat-grid{grid-template-columns:1fr}
    .hero{padding:26px 0 24px} .hero h1{font-size:32px}
    .searchbar{flex-direction:column} .searchbar button{padding:13px}
    .cta{flex-direction:column;align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">Devbhoomi Charitable Trust NZ</div>
      <h1>Community <em>Business Directory</em></h1>
      <p class="sub">Discover trusted businesses and services across Aotearoa New Zealand</p>
      <form class="searchbar" id="searchForm">
        <input type="search" id="searchInput" placeholder="Search businesses, services, trades…" aria-label="Search the directory">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main><div class="wrap" id="view"></div></main>

  <footer><div class="wrap">Devbhoomi Charitable Trust NZ · Registered Charity
    <a href="https://www.register.charities.govt.nz/Charity/CC61651" target="_blank" rel="noopener">CC61651</a></div></footer>

<script>
(function(){
  "use strict";
  var API_URL = "https://script.google.com/macros/s/AKfycbw0mnY6Cvb14HoBrkWTJitOu3HpLIkgYvKNbnLkGkcOXrNWqEtIGz0DHGrc0frm4FU7Pg/exec";
  var SUBMIT_URL = "/submit/";

  // Category → colour + icon. Uses your real 20 category names.
  var ICONS = {
    cart:'<path d="M3 4h2l2.2 11a1.6 1.6 0 0 0 1.6 1.3h8a1.6 1.6 0 0 0 1.6-1.2L21 8H6"/><circle cx="9" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/>',
    cup:'<path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/><path d="M17 9h2a2 2 0 0 1 0 4h-2"/><path d="M6 3v2M10 3v2M14 3v2"/>',
    plate:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
    heart:'<path d="M12 20s-6.5-4.2-9-8.2A4.3 4.3 0 0 1 12 6a4.3 4.3 0 0 1 9 5.8c-2.5 4-9 8.2-9 8.2z"/>',
    scales:'<path d="M12 3v18M5 21h14M6 7h12M6 7l-3 6h6zM18 7l-3 6h6z"/>',
    coin:'<circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>',
    house:'<path d="M4 11l8-6 8 6M6 10v9h12v-9M10 19v-5h4v5"/>',
    cap:'<path d="M2 9l10-4 10 4-10 4z"/><path d="M6 11v4c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3v-4"/>',
    smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14s1.4 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><circle cx="9" cy="10" r=".6"/><circle cx="15" cy="10" r=".6"/>',
    temple:'<path d="M4 20h16M5 20v-6h14v6M3 14l9-7 9 7M10 20v-3h4v3"/>',
    people:'<circle cx="9" cy="8" r="3"/><path d="M3 19a6 6 0 0 1 12 0"/><circle cx="17.5" cy="9" r="2.2"/><path d="M15 19a4.5 4.5 0 0 1 6.5 0"/>',
    globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
    bag:'<path d="M6 8h12l-1 11H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    sparkle:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
    truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18.5" r="1.4"/><circle cx="17" cy="18.5" r="1.4"/>',
    wrench:'<path d="M15 5a4 4 0 0 0-5.3 4.7L4 15.5 6.5 18l5.8-5.7A4 4 0 0 0 17 7l-2.3 2.3-2-2z"/>',
    monitor:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
    news:'<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 9h7M7 12h7M7 15h4"/>',
    tag:'<path d="M3 12l9-9 9 9-9 9z"/><circle cx="9" cy="9" r="1"/>'
  };
  var CATEGORY_META = {
    "Food & Grocery":{c:"#C0832C",i:"cart"},
    "Restaurant & Cafe":{c:"#B5532A",i:"cup"},
    "Catering & Events":{c:"#8E5572",i:"plate"},
    "Health & Wellness":{c:"#1F7A5A",i:"heart"},
    "Legal & Migration":{c:"#1F2D3D",i:"scales"},
    "Finance & Accounting":{c:"#4F6B3A",i:"coin"},
    "Real Estate & Mortgage":{c:"#3E6680",i:"house"},
    "Education & Tutoring":{c:"#2F6690",i:"cap"},
    "Childcare & Early Learning":{c:"#D08C3F",i:"smile"},
    "Temple & Religious":{c:"#8E2F4C",i:"temple"},
    "Cultural & Community":{c:"#A23B72",i:"people"},
    "Travel & Tourism":{c:"#2A9D8F",i:"globe"},
    "Fashion & Accessories":{c:"#B5476B",i:"bag"},
    "Beauty & Personal Care":{c:"#C46B98",i:"sparkle"},
    "Freight & Logistics":{c:"#5A6470",i:"truck"},
    "Trades & Home Services":{c:"#9C6B2E",i:"wrench"},
    "IT & Technology":{c:"#3D5A80",i:"monitor"},
    "Media & Publishing":{c:"#6A4C93",i:"news"},
    "Community & Organisations":{c:"#2C6E63",i:"people"},
    "Other":{c:"#6B6B6B",i:"tag"}
  };
  function catMeta(name){ return CATEGORY_META[name] || {c:"#6B6B6B",i:"tag"}; }
  var CAT_ORDER = Object.keys(CATEGORY_META);

  // State
  var listings = [];
  var loadError = false;
  var viewEl = document.getElementById("view");

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function initials(name){
    var p = String(name||"").trim().split(/\s+/);
    if (p.length >= 2) return (p[0][0]+p[1][0]).toUpperCase();
    return String(name||"?").slice(0,2).toUpperCase();
  }
  function tint(hex){ // light tint of a hex colour for avatar bg
    var n = hex.replace("#",""); var r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
    return "rgba("+r+","+g+","+b+",0.14)";
  }
  function truncate(s,n){ s=String(s||""); return s.length>n ? s.slice(0,n).trim()+"…" : s; }
  function plural(n){ return n===1 ? "1 listing" : n+" listings"; }

  // ---- Data ----
  function load(){
    fetch(API_URL + "?action=listings")
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) throw new Error("bad");
        listings = d.listings || [];
        route();
      })
      .catch(function(){ loadError = true; route(); });
  }

  // ---- Avatar / icon helpers ----
  function avatar(l, size){
    var m = catMeta(l.category);
    return '<div class="avatar" style="background:'+tint(m.c)+';color:'+m.c+';'+(size?'width:'+size+'px;height:'+size+'px;':'')+'">'+esc(initials(l.name))+'</div>';
  }
  function catIcon(name){
    var m = catMeta(name);
    return '<div class="cat-ico" style="background:'+m.c+'"><svg viewBox="0 0 24 24">'+(ICONS[m.i]||ICONS.tag)+'</svg></div>';
  }

  // ---- Shared listing card ----
  function listingCard(l){
    var tags = (l.tags||[]).slice(0,4).map(function(t){ return '<span class="lc-tag">'+esc(t)+'</span>'; }).join("");
    var web = l.website ? '<a class="lbtn" href="'+esc(l.website)+'" target="_blank" rel="noopener">Website</a>' : "";
    return '<div class="lcard'+(l.featured?' feat':'')+'">'+
      '<div class="lcard-top">'+avatar(l)+
        '<div><div class="lc-name">'+esc(l.name)+(l.featured?'<span class="badge">Featured</span>':'')+'</div>'+
        '<div class="lc-meta"><span class="lc-cat">'+esc(l.category)+'</span> · <span>'+esc(l.region)+'</span></div></div>'+
      '</div>'+
      (l.description?'<p class="lc-desc">'+esc(truncate(l.description,130))+'</p>':"")+
      (tags?'<div class="lc-tags">'+tags+'</div>':"")+
      '<div class="lc-actions">'+web+
        '<a class="lbtn primary" href="#/listing/'+encodeURIComponent(l.ref)+'">View details</a>'+
      '</div>'+
    '</div>';
  }

  // ---- Views ----
  function renderHome(){
    if (loadError){ viewEl.innerHTML = '<div class="empty"><h2>Directory unavailable</h2><p>We couldn\'t load listings just now. Please refresh in a moment.</p></div>'; return; }

    var html = "";

    // Featured
    var featured = listings.filter(function(l){ return l.featured; }).slice(0,6);
    if (featured.length){
      html += '<div class="sec"><div class="seclabel">★ Featured listings</div><div class="feat-grid">'+
        featured.map(function(l){
          return '<div class="feat-card" onclick="location.hash=\'#/listing/'+encodeURIComponent(l.ref)+'\'">'+avatar(l)+
            '<div><div class="fc-name">'+esc(l.name)+'</div><div class="fc-cat">'+esc(l.category)+'</div>'+
            '<div class="fc-loc">◦ '+esc(l.region)+'</div></div></div>';
        }).join("")+'</div></div>';
    }

    // Categories (only those with listings), in canonical order
    var counts = {};
    listings.forEach(function(l){ counts[l.category] = (counts[l.category]||0)+1; });
    var present = CAT_ORDER.filter(function(c){ return counts[c]; });
    // include any categories not in CAT_ORDER (safety)
    Object.keys(counts).forEach(function(c){ if (present.indexOf(c)===-1) present.push(c); });

    if (present.length){
      html += '<div class="sec"><div class="seclabel dark">Browse by category</div><div class="cat-grid">'+
        present.map(function(c){
          return '<div class="cat-tile" onclick="location.hash=\'#/category/'+encodeURIComponent(c)+'\'">'+
            catIcon(c)+'<div class="cat-name">'+esc(c)+'</div><div class="cat-count">'+plural(counts[c])+'</div></div>';
        }).join("")+'</div></div>';
    } else {
      html += '<div class="empty"><h2>Listings coming soon</h2><p>The directory is just getting started — check back shortly.</p></div>';
    }

    // CTA
    html += '<div class="cta"><div><h3>List your business here</h3>'+
      '<p class="cta-sub">Support the community · Koha welcomed · Renewed annually</p>'+
      '<p class="cta-note">Koha is a gesture of goodwill — your contribution keeps this directory free for everyone</p></div>'+
      '<a href="'+SUBMIT_URL+'">Submit a listing</a></div>';

    viewEl.innerHTML = html;
  }

  // Sorting + pagination state (shared by category & search)
  var PER_PAGE = 12;
  var sortMode = "featured"; // "featured" | "az"

  function applySort(items){
    var arr = items.slice();
    if (sortMode === "az"){
      arr.sort(function(a,b){ return String(a.name).localeCompare(String(b.name), "en", {sensitivity:"base"}); });
    } else {
      arr.sort(function(a,b){
        var f = (b.featured?1:0)-(a.featured?1:0);
        return f !== 0 ? f : String(a.name).localeCompare(String(b.name), "en", {sensitivity:"base"});
      });
    }
    return arr;
  }

  function sortBar(){
    return '<div class="sortbar">Sort:<div class="seg">'+
      '<button data-sort="featured" aria-pressed="'+(sortMode==="featured")+'">Featured first</button>'+
      '<button data-sort="az" aria-pressed="'+(sortMode==="az")+'">A–Z</button>'+
      '</div></div>';
  }

  function pager(total, page, baseHash){
    var pages = Math.ceil(total / PER_PAGE);
    if (pages <= 1) return "";
    var btn = function(p, label, opts){
      opts = opts || {};
      return '<button '+(opts.disabled?'disabled ':'')+(opts.current?'aria-current="true" ':'')+
        'onclick="location.hash=\''+baseHash+(baseHash.indexOf("?")>-1?"&":"?")+'page='+p+'\'">'+(label||p)+'</button>';
    };
    var out = btn(page-1, "‹", {disabled: page<=1});
    for (var p=1; p<=pages; p++){
      if (p===1 || p===pages || Math.abs(p-page)<=1){ out += btn(p, p, {current: p===page}); }
      else if (p===page-2 || p===page+2){ out += '<span class="ell">…</span>'; }
    }
    out += btn(page+1, "›", {disabled: page>=pages});
    return '<div class="pager">'+out+'</div>';
  }

  function renderCategory(name, page){
    page = page || 1;
    var items = applySort(listings.filter(function(l){ return l.category === name; }));
    var total = items.length;
    var start = (page-1)*PER_PAGE;
    var pageItems = items.slice(start, start+PER_PAGE);
    var baseHash = "#/category/"+encodeURIComponent(name);

    var html = '<div class="breadcrumb"><a onclick="location.hash=\'\'">Directory</a> › '+esc(name)+'</div>'+
      '<div class="view-head"><h2>'+esc(name)+'</h2>'+
      (total?'<div class="sortbar-wrap">'+sortBar()+'</div>':'<span class="count">'+plural(total)+'</span>')+'</div>';

    if (!total){ viewEl.innerHTML = html + '<div class="empty"><p>No listings in this category yet.</p></div>'; return; }

    html += '<span class="count" style="display:block;margin:-10px 0 16px">'+plural(total)+'</span>';
    html += '<div class="cards">'+pageItems.map(listingCard).join("")+'</div>';
    html += pager(total, page, baseHash);
    viewEl.innerHTML = html;
    wireSort(function(){ renderCategory(name, 1); });
  }

  function wireSort(rerender){
    var els = document.querySelectorAll(".sortbar [data-sort]");
    els.forEach(function(b){
      b.addEventListener("click", function(){ sortMode = b.getAttribute("data-sort"); rerender(); });
    });
  }

  function renderSearch(q){
    var query = (q||"").trim().toLowerCase();
    var items = !query ? [] : listings.filter(function(l){
      return [l.name,l.category,l.region,l.description,l.languages,(l.tags||[]).join(" ")]
        .join(" ").toLowerCase().indexOf(query) !== -1;
    });
    items.sort(function(a,b){ return (b.featured?1:0)-(a.featured?1:0); });
    var html = '<div class="breadcrumb"><a onclick="location.hash=\'\'">Directory</a> › Search: '+esc(q)+'</div>'+
      '<div class="view-head"><h2>Search results</h2><span class="count">'+plural(items.length)+' for “'+esc(q)+'”</span></div>';
    html += items.length ? '<div class="cards">'+items.map(listingCard).join("")+'</div>'
                         : '<div class="empty"><h2>No matches</h2><p>Try a different word, or browse by category from the directory home.</p></div>';
    viewEl.innerHTML = html;
  }

  function renderDetail(ref){
    var l = listings.filter(function(x){ return x.ref === ref; })[0];
    if (!l){ viewEl.innerHTML = '<div class="empty"><h2>Listing not found</h2><p><a onclick="location.hash=\'\'" style="color:var(--ochre-deep);cursor:pointer">Back to directory</a></p></div>'; return; }
    var tags = (l.tags||[]).map(function(t){ return '<span class="lc-tag">'+esc(t)+'</span>'; }).join("");
    var rows = "";
    if (l.mobile) rows += '<div class="row"><span class="lab">Mobile</span><span>'+esc(l.mobile)+(l.whatsapp?' &nbsp;<span class="lc-tag">WhatsApp</span>':'')+'</span></div>';
    if (l.landline) rows += '<div class="row"><span class="lab">Landline</span><span>'+esc(l.landline)+'</span></div>';
    if (l.email) rows += '<div class="row"><span class="lab">Email</span><span><a href="mailto:'+esc(l.email)+'" style="color:var(--ochre-deep)">'+esc(l.email)+'</a></span></div>';
    if (l.website) rows += '<div class="row"><span class="lab">Web / FB</span><span><a href="'+esc(l.website)+'" target="_blank" rel="noopener" style="color:var(--ochre-deep)">'+esc(l.website)+'</a></span></div>';

    viewEl.innerHTML =
      '<div class="breadcrumb"><a onclick="location.hash=\'\'">Directory</a> › <a onclick="location.hash=\'#/category/'+encodeURIComponent(l.category)+'\'">'+esc(l.category)+'</a> › '+esc(l.name)+'</div>'+
      '<div class="detail"><div class="detail-head">'+avatar(l,64)+
        '<div><h1>'+esc(l.name)+(l.featured?'<span class="badge">Featured</span>':'')+'</h1>'+
        '<div class="d-cat">'+esc(l.category)+' · '+esc(l.region)+'</div></div></div>'+
        (l.description?'<h3>About</h3><p>'+esc(l.description)+'</p>':"")+
        (l.languages?'<h3>Languages</h3><p>'+esc(l.languages)+'</p>':"")+
        (tags?'<h3>Services</h3><div class="lc-tags">'+tags+'</div>':"")+
        '<h3>Contact</h3><div class="d-contact">'+(rows||'<p class="lc-meta">Contact details not provided.</p>')+'</div>'+
        '<div class="d-actions">'+
          (l.website?'<a class="lbtn primary" href="'+esc(l.website)+'" target="_blank" rel="noopener">Visit website</a>':"")+
          (l.email?'<a class="lbtn" href="mailto:'+esc(l.email)+'">Send enquiry</a>':"")+
        '</div></div>';
  }

  // ---- Router ----
  function route(){
    var h = location.hash || "";
    if (h.indexOf("#/category/") === 0){
      var rest = h.slice(11);
      var pg = 1; var qm = rest.indexOf("?");
      if (qm > -1){ var mp = rest.match(/page=(\d+)/); if (mp) pg = parseInt(mp[1],10); rest = rest.slice(0, qm); }
      renderCategory(decodeURIComponent(rest), pg);
    }
    else if (h.indexOf("#/search") === 0){ var m=h.match(/q=([^&]*)/); renderSearch(m?decodeURIComponent(m[1]):""); }
    else if (h.indexOf("#/listing/") === 0){ renderDetail(decodeURIComponent(h.slice(10))); }
    else { renderHome(); }
    window.scrollTo({top:0,behavior:"smooth"});
  }
  window.addEventListener("hashchange", route);

  document.getElementById("searchForm").addEventListener("submit", function(e){
    e.preventDefault();
    var q = document.getElementById("searchInput").value.trim();
    location.hash = q ? "#/search?q="+encodeURIComponent(q) : "";
  });

  // ---- Init ----
  load();
})();
</script>
</body>
</html>
