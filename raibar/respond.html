<!--
  RAIBAR - Matrimonial Portal - Respond to Interest (Netlify version)
  Plain static HTML. Reads the token from window.location.search directly
  now (no more google.script.url.getLocation workaround needed - that was
  only necessary because Apps Script served this inside a sandboxed
  iframe. A plain Netlify page doesn't have that problem).
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Respond to interest - Raibar</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #F2EEE4;
      margin: 0;
      padding: 24px 16px;
      color: #2B2B2B;
    }
    .card {
      max-width: 480px;
      margin: 40px auto;
      background: #FFFFFF;
      border: 1px solid #E6DDCB;
      border-radius: 10px;
      padding: 28px;
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.6; color: #6B6B6B; }
    .buttons { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #E6DDCB;
    }
    #acceptBtn { background: #1F2D3D; color: #FBF7EF; border-color: #1F2D3D; }
    #declineBtn { background: #FFFFFF; color: #2B2B2B; }
    select {
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      border-radius: 6px;
      border: 1px solid #E6DDCB;
      font-size: 14px;
      display: none;
    }
    #message { font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="initial">
      <h1>Someone is interested in connecting</h1>
      <p>Take a look at the details we sent by email, then choose how you'd like to respond.</p>

      <select id="revealChoice">
        <option value="WhatsApp">Share my WhatsApp number</option>
        <option value="Email">Share my email instead</option>
        <option value="None">Don't share contact - I'll reach out myself</option>
      </select>

      <div class="buttons">
        <button id="declineBtn">Decline</button>
        <button id="acceptBtn">Accept</button>
      </div>
      <div class="buttons" id="confirmRow" style="display:none;">
        <button id="confirmAcceptBtn" style="width:100%;">Confirm</button>
      </div>
    </div>

    <div id="message" style="display:none;"></div>
  </div>

  <script>
    const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbwWTtikq9BSSEB2RKFJ54A8qrl-uD_0lYGZNwvcoMjoaiDgoXEx4LC8EFv_tEb97_0/exec';

    function callApi(fn, args) {
      return fetch(APPS_SCRIPT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args || [] })
      }).then(function (r) { return r.json(); });
    }

    const token = new URLSearchParams(window.location.search).get('token');

    function showMessage(text) {
      document.getElementById('initial').style.display = 'none';
      const msgEl = document.getElementById('message');
      msgEl.style.display = 'block';
      msgEl.textContent = text;
    }

    document.getElementById('acceptBtn').addEventListener('click', function () {
      document.getElementById('revealChoice').style.display = 'block';
      document.getElementById('confirmRow').style.display = 'flex';
      this.style.display = 'none';
      document.getElementById('declineBtn').style.display = 'none';
    });

    document.getElementById('confirmAcceptBtn').addEventListener('click', function () {
      const choice = document.getElementById('revealChoice').value;
      this.disabled = true;

      callApi('handleAcceptInterest', [token, choice]).then(function (result) {
        if (result.success) {
          showMessage('Thanks - you\'ve accepted. The other person will be sent a link to connect based on your choice.');
        } else {
          showMessage(result.error || 'Something went wrong.');
        }
      }).catch(function (err) {
        showMessage('Something went wrong. Please try again later.');
        console.error(err);
      });
    });

    document.getElementById('declineBtn').addEventListener('click', function () {
      document.getElementById('acceptBtn').disabled = true;
      this.disabled = true;

      callApi('handleDeclineInterest', [token]).then(function (result) {
        showMessage(result.success
          ? 'No problem - this request has been declined.'
          : (result.error || 'Something went wrong.'));
      }).catch(function (err) {
        showMessage('Something went wrong. Please try again later.');
        console.error(err);
      });
    });
  </script>
</body>
</html>
