<!--
  RAIBAR - Matrimonial Portal - Public Listing Page (Netlify version)
  Plain static HTML, no Apps Script hosting involved. Calls the Apps
  Script API via fetch() instead of google.script.run.

  Place this in your Netlify-hosted repo, e.g. as /raibar/index.html
  (adjust APPS_SCRIPT_API_URL below to your deployed Apps Script /exec URL,
  and update it whenever you create a new deployment version).
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raibar - Devbhoomi Charitable Trust NZ</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #F2EEE4;
      margin: 0;
      padding: 24px 16px;
      color: #2B2B2B;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .create-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.2px;
      color: #FBF7EF;
      background: #1F2D3D;
      padding: 11px 22px;
      border-radius: 24px;
      text-decoration: none;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(31,45,61,0.25);
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .create-link:hover {
      background: #2C3E50;
      box-shadow: 0 4px 10px rgba(31,45,61,0.3);
      transform: translateY(-1px);
    }
    .create-link .plus-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #C0832C;
      color: #FBF7EF;
      font-size: 12px;
      line-height: 1;
    }

    .filters { display: flex; gap: 8px; margin-bottom: 20px; }
    .filters button {
      flex: 1; padding: 10px; border: 1px solid #E6DDCB; background: #FFFFFF;
      border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    .filters button.active { background: #1F2D3D; color: #FBF7EF; border-color: #1F2D3D; }

    #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .card {
      background: #FFFFFF; border: 1px solid #E6DDCB; border-radius: 12px;
      padding: 14px; text-align: center; cursor: pointer;
    }
    .card p.name { font-weight: bold; font-size: 14px; margin: 8px 0 2px; }
    .card p.meta { font-size: 12px; color: #6B6B6B; margin: 0 0 8px; }

    .badge {
      display: inline-block; font-size: 11px; padding: 3px 10px;
      border-radius: 20px; font-weight: bold;
    }
    .badge-bride { background: #F7E6EE; color: #A8447A; }
    .badge-groom { background: #E3EAF2; color: #2C5583; }
    .badge-other { background: #E6DDCB; color: #6B6B6B; }

    #status { text-align: center; color: #6B6B6B; font-size: 13px; padding: 20px 0; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #E6DDCB;
      border-top-color: #C0832C;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #detailView { display: none; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #1F2D3D; cursor: pointer; margin-bottom: 16px;
      background: none; border: none; padding: 0;
    }
    .detail-card {
      background: #FFFFFF; border: 1px solid #E6DDCB; border-radius: 12px;
      padding: 24px; max-width: 460px; margin: 0 auto;
    }
    .detail-header { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
    .detail-header .name { font-weight: bold; font-size: 17px; margin: 0; }
    .detail-header .meta { font-size: 13px; color: #6B6B6B; margin: 2px 0 0; }
    .detail-bio { font-size: 14px; color: #2B2B2B; line-height: 1.6; margin: 0 0 18px; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #F0EBDD; font-size: 13px; }
    .detail-row .label { color: #6B6B6B; }
    .detail-row .value { font-weight: bold; text-align: right; max-width: 60%; }
    #interestBtn {
      width: 100%; margin-top: 20px; padding: 12px; border-radius: 6px;
      font-size: 14px; cursor: pointer; border: 1px solid #1F2D3D;
      background: #1F2D3D; color: #FBF7EF;
    }
    #interestMessage { font-size: 13px; margin-top: 12px; text-align: center; color: #6B6B6B; }
    .hero-banner {
      width: 100%;
      max-width: 1100px;
      height: 260px;
      object-fit: cover;
      display: block;
      margin: 0 auto 24px;
    }
    @media (max-width: 900px) {
      .hero-banner { height: 200px; }
    }
    @media (max-width: 480px) {
      .hero-banner { height: 150px; }
    }
  </style>
</head>
<body>
  <img src="https://dbctnz.org.nz/images/uploads/raibar-hero.png" alt="Raibar - a message which connects hearts, presented by Devbhoomi Charitable Trust NZ" class="hero-banner">

  <div class="container">

    <div id="listingView">

      <h1>Raibar - Browse profiles</h1>
      <a class="create-link" href="submit.html"><span class="plus-icon">+</span> Create your profile</a>

      <div class="filters">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Female">Brides</button>
        <button class="filter-btn" data-filter="Male">Grooms</button>
      </div>

      <div id="status"><span class="spinner"></span>Loading profiles...</div>
      <div id="grid"></div>
    </div>

    <div id="detailView">
      <button class="back-link" id="backBtn">&larr; Back to listing</button>
      <div class="detail-card">
        <div class="detail-header">
          <div id="detailAvatar"></div>
          <div>
            <p class="name" id="detailName"></p>
            <p class="meta" id="detailMeta"></p>
          </div>
        </div>
        <p class="detail-bio" id="detailBio"></p>
        <div id="detailRows"></div>
        <button id="interestBtn">Show interest</button>
        <p id="interestMessage" style="display:none;"></p>
      </div>
    </div>

  </div>

  <script>
    // ---- Apps Script API bridge ----
    // Update this whenever you create a new Apps Script deployment version.
    const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbwWTtikq9BSSEB2RKFJ54A8qrl-uD_0lYGZNwvcoMjoaiDgoXEx4LC8EFv_tEb97_0/exec';

    function callApi(fn, args) {
      return fetch(APPS_SCRIPT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
        body: JSON.stringify({ fn: fn, args: args || [] })
      }).then(function (r) { return r.json(); });
    }

    let currentProfiles = [];

    function namasteAvatarSvg(colorClass) {
      const stroke = colorClass === 'badge-bride' ? '#A8447A' : (colorClass === 'badge-groom' ? '#2C5583' : '#6B6B6B');
      const bg = colorClass === 'badge-bride' ? '#F7E6EE' : (colorClass === 'badge-groom' ? '#E3EAF2' : '#E6DDCB');
      return '<svg width="52" height="52" viewBox="0 0 64 64">' +
        '<circle cx="32" cy="32" r="32" fill="' + bg + '"/>' +
        '<circle cx="32" cy="24" r="9" fill="none" stroke="' + stroke + '" stroke-width="2"/>' +
        '<path d="M18 50 Q32 37 46 50" fill="none" stroke="' + stroke + '" stroke-width="2"/>' +
        '<path d="M32 39 L32 29" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linecap="round"/>' +
        '<path d="M32 29 Q27 25 25 29" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linecap="round"/>' +
        '<path d="M32 29 Q37 25 39 29" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linecap="round"/>' +
        '</svg>';
    }

    function badgeClassFor(gender) {
      if (gender === 'Female') return 'badge-bride';
      if (gender === 'Male') return 'badge-groom';
      return 'badge-other';
    }
    function badgeLabelFor(gender) {
      if (gender === 'Female') return 'Bride';
      if (gender === 'Male') return 'Groom';
      return gender;
    }

    function loadProfiles(filter) {
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').innerHTML = '<span class="spinner"></span>Loading profiles...';
      document.getElementById('grid').innerHTML = '';

      callApi('getApprovedListing', [filter]).then(function (result) {
        renderProfiles(result);
      }).catch(function (err) {
        document.getElementById('status').textContent = 'Something went wrong loading profiles. Please try again later.';
        console.error(err);
      });
    }

    function renderProfiles(result) {
      const statusEl = document.getElementById('status');
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (!result || !result.success) {
        statusEl.textContent = 'Could not load profiles right now.';
        return;
      }
      if (result.profiles.length === 0) {
        statusEl.textContent = 'No profiles to show right now.';
        return;
      }
      statusEl.style.display = 'none';
      currentProfiles = result.profiles;

      result.profiles.forEach(function (p) {
        const badgeClass = badgeClassFor(p.gender);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          namasteAvatarSvg(badgeClass) +
          '<p class="name">' + escapeHtml(p.first_name) + '</p>' +
          '<p class="meta">' + escapeHtml(String(p.age)) + ' &middot; ' + escapeHtml(p.region_or_city) + '</p>' +
          '<span class="badge ' + badgeClass + '">' + escapeHtml(badgeLabelFor(p.gender)) + '</span>';
        card.addEventListener('click', function () { showDetail(p.profile_id); });
        grid.appendChild(card);
      });
    }

    function showDetail(profileId) {
      const p = currentProfiles.find(function (x) { return x.profile_id === profileId; });
      if (!p) return;

      const badgeClass = badgeClassFor(p.gender);
      document.getElementById('detailAvatar').innerHTML = namasteAvatarSvg(badgeClass);
      document.getElementById('detailName').textContent = p.first_name;
      document.getElementById('detailMeta').textContent =
        p.age + ' \u00b7 ' + p.height_cm + ' cm \u00b7 ' + p.region_or_city + ', ' + p.country;
      document.getElementById('detailBio').textContent = p.bio;

      const rows = [
        ['Education', p.education],
        ['Profession', p.profession],
        ['Religion', p.religion || '-'],
        ['Marital status', p.marital_status || '-']
      ];
      document.getElementById('detailRows').innerHTML = rows.map(function (r) {
        return '<div class="detail-row"><span class="label">' + escapeHtml(r[0]) + '</span><span class="value">' + escapeHtml(String(r[1])) + '</span></div>';
      }).join('');

      const interestBtn = document.getElementById('interestBtn');
      interestBtn.disabled = false;
      interestBtn.textContent = 'Show interest';
      document.getElementById('interestMessage').style.display = 'none';
      interestBtn.onclick = function () { handleShowInterest(p.profile_id, p.first_name); };

      document.getElementById('listingView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
    }

    function handleShowInterest(profileId, name) {
      const email = window.prompt(
        'Enter the email address you used for your own Raibar profile ' +
        '(you need an approved profile of your own to show interest in ' + name + '):'
      );
      if (!email) return;

      const btn = document.getElementById('interestBtn');
      const msg = document.getElementById('interestMessage');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      callApi('submitInterest', [profileId, email]).then(function (result) {
        if (result.success) {
          btn.style.display = 'none';
          msg.style.display = 'block';
          msg.textContent = 'Interest sent! We will let you know if they respond.';
        } else {
          btn.disabled = false;
          btn.textContent = 'Show interest';
          msg.style.display = 'block';
          msg.textContent = result.error || 'Something went wrong.';
        }
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Show interest';
        msg.style.display = 'block';
        msg.textContent = 'Something went wrong. Please try again later.';
        console.error(err);
      });
    }

    document.getElementById('backBtn').addEventListener('click', function () {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listingView').style.display = 'block';
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        loadProfiles(btn.getAttribute('data-filter'));
      });
    });

    loadProfiles('All');
  </script>
</body>
</html>
